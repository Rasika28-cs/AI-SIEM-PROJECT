<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI SIEM Assistant</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f5f5f5;
            margin:0;
        }

        nav{
            background:#212529;
            padding:15px;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin-right:20px;
        }

        .container{
            width:90%;
            margin:30px auto;
        }

        .card{
            background:white;
            padding:20px;
            border-radius:8px;
            box-shadow:0 0 8px rgba(0,0,0,.1);
        }

        input,select{
            width:100%;
            padding:10px;
            margin:10px 0;
        }

        button{
            padding:10px 20px;
            cursor:pointer;
        }
    </style>

</head>
<body>

<nav>

    <a href="/">Home</a>

    {% if user.is_authenticated %}

        <a href="/logout/">Logout</a>

    {% else %}

        <a href="/login/">Login</a>
        <a href="/register/">Register</a>

    {% endif %}

</nav>

<div class="container">

    {% block content %}

    {% endblock %}

</div>

</body>
</html>
